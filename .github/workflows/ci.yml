name: Tests & Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: "Unit tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
      fail-fast: false  # surface failures on both versions independently

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff

      - name: Lint (ruff — pyflakes + syntax only)
        # Narrow ruleset on purpose: pyflakes catches real bugs (unused
        # imports, undefined names, etc.) without turning every PR into a
        # style argument. E9 catches syntax errors.
        run: ruff check src/ tests/ evaluation/ --select F,E9

      - name: Unit tests
        # All tests are agent/redactor/orchestrator units with mocked Claude —
        # zero API spend. The live eval suite is the separate gated job below.
        run: |
          mkdir -p artifacts
          python -m pytest tests/ \
            --junit-xml=artifacts/pytest-results-${{ matrix.python-version }}.xml \
            -v

      - name: Upload pytest results
        if: always()  # surface report even on test failure
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: artifacts/pytest-results-${{ matrix.python-version }}.xml
          retention-days: 90

  security-scan:
    name: Security scan (SAST · CVE · secrets · lock-file)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs in parallel with unit-tests — no dependency needed.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required by TruffleHog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must match the Python version used to generate requirements-lock.txt
          # (local dev uses Python 3.13, Dockerfile also uses 3.13).
          python-version: "3.13"

      - name: Install scan tools
        run: pip install bandit pip-audit pip-tools

      - name: SAST — bandit (medium severity and above)
        # -ll = medium+ severity, -ii = medium+ confidence.
        # Excluded: tests/ (test scaffolding uses patterns that look sketchy out of context).
        # Exit 1 only on HIGH severity (bandit exit code 1) so medium findings are
        # uploaded as an artifact but don't break the build until reviewed.
        run: |
          mkdir -p artifacts
          bandit -r src/ -ll -ii \
            --exclude src/warmup.py \
            --format json -o artifacts/bandit.json || true
          # Fail the step if any HIGH severity issues are found
          bandit -r src/ -lll -iii \
            --exclude src/warmup.py \
            --format json -o /dev/null
        continue-on-error: false

      - name: CVE scan — pip-audit
        run: |
          mkdir -p artifacts
          pip-audit -r requirements.txt \
            --format json \
            --output artifacts/pip-audit.json || true
          # Re-run without --output for human-readable exit code.
          # CVE-2026-45829 (chromadb) is FIXED: requirements.txt pins chromadb<1.0.0;
          #   CVE only affects >=1.0.0. Resolved to 0.6.3.
          # CVE-2025-69872 (diskcache 5.6.3): pulled in by mcp→fastmcp→diskcache.
          #   5.6.3 is the only available version; no fix upstream.
          #   Revisit when fastmcp drops or patches the diskcache dependency.
          # CVE-2025-3000 (torch): no torch<2.6.0 wheels exist for Python 3.13,
          #   making a safe pin impossible while keeping our 3.13 CI matrix.
          #   Revisit when PyTorch publishes a patched release.
          pip-audit -r requirements.txt \
            --ignore-vuln CVE-2025-69872 \
            --ignore-vuln CVE-2025-3000

      - name: Secret scan — TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --only-verified

      - name: Verify requirements-lock.txt is up to date
        # Ensures no one updated requirements.txt without regenerating the lock file.
        # pip-compile writes to stdout in dry-run; compare against committed file.
        run: |
          pip-compile --generate-hashes --allow-unsafe \
            --output-file /tmp/requirements-lock-check.txt \
            requirements.txt 2>/dev/null
          if ! diff -q requirements-lock.txt /tmp/requirements-lock-check.txt > /dev/null 2>&1; then
            echo "::error::requirements-lock.txt is stale."
            echo "Re-run: pip-compile --generate-hashes --allow-unsafe --output-file requirements-lock.txt requirements.txt"
            diff requirements-lock.txt /tmp/requirements-lock-check.txt | head -40
            exit 1
          fi
          echo "requirements-lock.txt is up to date."

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: artifacts/
          retention-days: 90

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (verification only — no registry push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # We skip `load: true` deliberately. The CPU-only torch wheel keeps
          # the image around 1 GB; loading it into the local Docker daemon on
          # the runner competes with the buildx cache for disk. The
          # verification-only build (no load) is enough as a regression gate.
          # Run it locally to inspect: `docker build -t backlog-synthesizer .`
          load: false
          tags: backlog-synthesizer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  eval-suite:
    name: Eval suite (gated, live LLM)
    runs-on: ubuntu-latest
    # Burning real Anthropic credit, so we gate the trigger: never on PRs
    # from forks, never automatically. workflow_dispatch only — someone has
    # to consciously click "Run workflow". Push to main also triggers so
    # main stays green-gated on the eval harness.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    needs: unit-tests
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no API key configured
        # Forks won't have the secret; rather than failing the job, gate
        # downstream steps on this output so the job ends cleanly.
        id: gate
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping eval suite — ANTHROPIC_API_KEY secret not configured."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run eval suite (Anthropic Claude)
        # 10 golden cases, ~5 API calls each → ~50 calls per full run.
        # Cost on Sonnet at current pricing: roughly $2-4 per full run.
        # Tee output so it lands both in the job log (for quick read) and
        # in an artifact (for download / diff against previous runs).
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p artifacts
          python evaluation/run_evaluation.py --use-llm-judge 2>&1 \
            | tee artifacts/eval-results.txt

      - name: Regression dashboard (with enforcement)
        # Aggregate results and EXIT NON-ZERO if any case drops ≥0.10 vs main.
        # This gates PRs on output quality — a prompt change that degrades
        # the golden set will fail CI before merging.
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p artifacts
          python evaluation/dashboard.py \
            --md artifacts/dashboard.md \
            --fail-on-regression \
            --regression-threshold 0.10 \
            2>&1 | tee artifacts/dashboard.txt
          # dashboard.py exits 1 if regression found; propagate it
          exit ${PIPESTATUS[0]}

      - name: Upload eval results
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            artifacts/eval-results.txt
            artifacts/dashboard.txt
            artifacts/dashboard.md
            evaluation/results/**
          retention-days: 90
