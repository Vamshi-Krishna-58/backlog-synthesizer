name: Infra + Deploy → Azure

# Provisions Azure infrastructure with Terraform, then builds and deploys
# the container to Azure Container Apps.
#
# Triggers:
#   • Manual (workflow_dispatch) — choose action and environment
#   • Push to main               — auto deploy to staging
#
# Required GitHub Secrets:
#   AZURE_CREDENTIALS          Service principal JSON (from SPN setup)
#   ACR_REGISTRY               meridianmotorsacr.azurecr.io
#   AZURE_RESOURCE_GROUP       rg-meridian-motors
#   CONTAINERAPP_NAME_STAGING  backlog-synthesizer-staging
#   CONTAINERAPP_NAME          backlog-synthesizer-prod
#   TF_VAR_client_secret       SPN client secret (for Terraform)
#   ANTHROPIC_API_KEY, GOOGLE_API_KEY, JIRA_API_TOKEN, ENTRA_CLIENT_SECRET

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        default: deploy-staging
        options:
          - infra-only          # terraform apply only
          - deploy-staging      # build + deploy staging
          - deploy-production   # build + deploy production
          - infra-and-deploy    # terraform apply + build + deploy staging
          - terraform-destroy   # destroy all infra (careful!)

env:
  TF_WORKING_DIR: infra/terraform
  ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

jobs:
  # ── 1. Terraform — provision / update Azure infrastructure ──────────────────
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      inputs.action == 'infra-only' ||
      inputs.action == 'infra-and-deploy' ||
      github.event_name == 'push'
    outputs:
      acr_login_server: ${{ steps.tf-outputs.outputs.acr_login_server }}
      staging_url:      ${{ steps.tf-outputs.outputs.staging_url }}
      prod_url:         ${{ steps.tf-outputs.outputs.prod_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bootstrap Terraform state storage
        run: |
          az group create --name rg-tfstate --location eastus --output none 2>/dev/null || true
          az storage account create \
            --name meridianmotorstfstate \
            --resource-group rg-tfstate \
            --sku Standard_LRS \
            --output none 2>/dev/null || true
          az storage container create \
            --name tfstate \
            --account-name meridianmotorstfstate \
            --auth-mode login \
            --output none 2>/dev/null || true
          echo "✅ Terraform state storage ready"

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -out=tfplan \
            -var="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -var="tenant_id=$ARM_TENANT_ID" \
            -var="client_id=$ARM_CLIENT_ID" \
            -var="client_secret=$ARM_CLIENT_SECRET" \
            -var="anthropic_api_key=${{ secrets.ANTHROPIC_API_KEY }}" \
            -var="google_api_key=${{ secrets.GOOGLE_API_KEY || '' }}" \
            -var="jira_api_token=${{ secrets.JIRA_API_TOKEN }}" \
            -var="entra_client_secret=${{ secrets.ENTRA_CLIENT_SECRET }}"

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf-outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "staging_url=$(terraform output -raw staging_url)"           >> "$GITHUB_OUTPUT"
          echo "prod_url=$(terraform output -raw prod_url)"                 >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        run: |
          echo "## ✅ Terraform applied" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Staging URL | ${{ steps.tf-outputs.outputs.staging_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prod URL    | ${{ steps.tf-outputs.outputs.prod_url }} |"    >> $GITHUB_STEP_SUMMARY

  # ── 2. Build & push Docker image to ACR ─────────────────────────────────────
  build:
    name: Build & push → ACR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: terraform
    if: |
      always() &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      inputs.action != 'infra-only' &&
      inputs.action != 'terraform-destroy'
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          ACR_NAME=$(echo "${{ secrets.ACR_REGISTRY }}" | sed 's/\.azurecr\.io//')
          az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: meta
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/backlog-synthesizer:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/backlog-synthesizer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        id: set-image
        run: echo "image=${{ secrets.ACR_REGISTRY }}/backlog-synthesizer:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ── 3a. Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [terraform, build]
    timeout-minutes: 15
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        github.event_name == 'push' ||
        inputs.action == 'deploy-staging' ||
        inputs.action == 'infra-and-deploy'
      )
    environment: azure-staging

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to staging Container App
        run: |
          az containerapp update \
            --name "${{ secrets.CONTAINERAPP_NAME_STAGING }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_REGISTRY }}/backlog-synthesizer:${{ github.sha }}" \
            --output none
          echo "Deployed → ${{ secrets.ACR_REGISTRY }}/backlog-synthesizer:${{ github.sha }}"

      - name: Health check — staging
        run: |
          FQDN=$(az containerapp show \
            --name "${{ secrets.CONTAINERAPP_NAME_STAGING }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          URL="https://$FQDN/_stcore/health"
          echo "Probing: $URL"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
            echo "Attempt $i/18: HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "✅ Staging healthy: https://$FQDN"; exit 0; }
            sleep 10
          done
          echo "❌ Staging health check failed" >&2; exit 1

      - name: Write summary
        run: |
          FQDN=$(az containerapp show \
            --name "${{ secrets.CONTAINERAPP_NAME_STAGING }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "## ✅ Staging deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://$FQDN" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ secrets.ACR_REGISTRY }}/backlog-synthesizer:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ── 3b. Deploy to Production ─────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [terraform, build, deploy-staging]
    timeout-minutes: 15
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') &&
      inputs.action == 'deploy-production'
    environment: azure-production

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to production Container App
        run: |
          SUFFIX="sha-${GITHUB_SHA::8}"
          az containerapp update \
            --name "${{ secrets.CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_REGISTRY }}/backlog-synthesizer:${{ github.sha }}" \
            --revision-suffix "$SUFFIX" \
            --output none

      - name: Health check — production
        run: |
          FQDN=$(az containerapp show \
            --name "${{ secrets.CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          URL="https://$FQDN/_stcore/health"
          echo "Probing: $URL"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
            echo "Attempt $i/18: HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "✅ Production healthy: https://$FQDN"; exit 0; }
            sleep 10
          done
          echo "❌ Production health check failed" >&2; exit 1

      - name: Write summary
        run: |
          FQDN=$(az containerapp show \
            --name "${{ secrets.CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "## ✅ Production deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://$FQDN" >> $GITHUB_STEP_SUMMARY

  # ── 4. Terraform destroy (manual only, gated) ────────────────────────────────
  terraform-destroy:
    name: Terraform destroy ⚠️
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.action == 'terraform-destroy'
    environment: azure-production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -var="tenant_id=$ARM_TENANT_ID" \
            -var="client_id=$ARM_CLIENT_ID" \
            -var="client_secret=$ARM_CLIENT_SECRET" \
            -var="anthropic_api_key=${{ secrets.ANTHROPIC_API_KEY }}" \
            -var="google_api_key=${{ secrets.GOOGLE_API_KEY || '' }}" \
            -var="jira_api_token=${{ secrets.JIRA_API_TOKEN }}" \
            -var="entra_client_secret=${{ secrets.ENTRA_CLIENT_SECRET }}"
