name: Infra + Deploy → Azure

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        default: deploy-staging
        options:
          - infra-only
          - deploy-staging
          - deploy-production
          - infra-and-deploy

env:
  RG:              rg-meridian-motors
  ACR:             meridianmotorsacr0452
  ACR_SERVER:      meridianmotorsacr0452.azurecr.io
  CAE:             cae-meridian-motors
  STAGING_APP:     backlog-synthesizer-staging
  PROD_APP:        backlog-synthesizer-prod
  LOCATION:        eastus

jobs:
  # ── 1. Provision Azure infra via az CLI (idempotent) ───────────────────────
  provision:
    name: Provision Azure infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.action == 'infra-only' ||
      github.event.inputs.action == 'infra-and-deploy'

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resource group
        run: |
          az group create \
            --name "$RG" \
            --location "$LOCATION" \
            --output none
          echo "✅ Resource group: $RG"

      - name: Azure Container Registry
        run: |
          az acr create \
            --name "$ACR" \
            --resource-group "$RG" \
            --sku Basic \
            --admin-enabled true \
            --output none 2>/dev/null || echo "ACR already exists"
          echo "✅ ACR: $ACR_SERVER"

      - name: Container Apps environment
        run: |
          if ! az containerapp env show --name "$CAE" --resource-group "$RG" &>/dev/null; then
            az containerapp env create \
              --name "$CAE" \
              --resource-group "$RG" \
              --location "$LOCATION" \
              --output none
          fi
          echo "✅ Container Apps environment: $CAE"

      - name: Staging Container App (create if missing)
        run: |
          if ! az containerapp show --name "$STAGING_APP" --resource-group "$RG" &>/dev/null; then
            az containerapp create \
              --name "$STAGING_APP" \
              --resource-group "$RG" \
              --environment "$CAE" \
              --image "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
              --target-port 8502 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 1 \
              --output none
            echo "✅ Created staging app"
          else
            echo "✅ Staging app already exists"
          fi

      - name: Production Container App (create if missing)
        run: |
          if ! az containerapp show --name "$PROD_APP" --resource-group "$RG" &>/dev/null; then
            az containerapp create \
              --name "$PROD_APP" \
              --resource-group "$RG" \
              --environment "$CAE" \
              --image "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
              --target-port 8502 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 3 \
              --output none
            echo "✅ Created production app"
          else
            echo "✅ Production app already exists"
          fi

      - name: Summary
        run: |
          STAGING_FQDN=$(az containerapp show --name "$STAGING_APP" --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          PROD_FQDN=$(az containerapp show --name "$PROD_APP" --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "## ✅ Infrastructure ready" >> "$GITHUB_STEP_SUMMARY"
          echo "| App | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Staging | https://$STAGING_FQDN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prod    | https://$PROD_FQDN |"    >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Build Docker image and push to ACR ─────────────────────────────────
  build:
    name: Build & push → ACR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: provision
    if: >-
      always() &&
      (needs.provision.result == 'success' || needs.provision.result == 'skipped') &&
      github.event.inputs.action != 'infra-only'
    outputs:
      image: ${{ env.ACR_SERVER }}/backlog-synthesizer:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify ACR exists
        run: |
          if ! az acr show --name "$ACR" --query name -o tsv &>/dev/null; then
            echo "::error::ACR '$ACR' does not exist."
            echo "::error::Run this workflow with action=infra-and-deploy (or infra-only first)."
            echo "::error::Also confirm the SPN has Contributor role: Portal → Subscriptions → IAM → Add → Contributor → sp-backlog-synthesizer-github"
            exit 1
          fi
          echo "✅ ACR $ACR found"

      - name: Login to ACR
        run: az acr login --name "$ACR"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/backlog-synthesizer:${{ github.sha }}
            ${{ env.ACR_SERVER }}/backlog-synthesizer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3a. Deploy to Staging ─────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [provision, build]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event.inputs.action == 'deploy-staging' ||
        github.event.inputs.action == 'infra-and-deploy'
      )
    environment: azure-staging

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure app secrets
        run: |
          az containerapp secret set \
            --name "$STAGING_APP" \
            --resource-group "$RG" \
            --secrets \
              "anthropic-api-key=${{ secrets.ANTHROPIC_API_KEY }}" \
              "jira-api-token=${{ secrets.JIRA_API_TOKEN }}" \
              "entra-client-secret=${{ secrets.ENTRA_CLIENT_SECRET }}" \
            --output none

      - name: Configure ACR pull secret
        run: |
          ACR_PASS=$(az acr credential show --name "$ACR" --query passwords[0].value -o tsv)
          az containerapp secret set \
            --name "$STAGING_APP" \
            --resource-group "$RG" \
            --secrets "acr-password=$ACR_PASS" \
            --output none

      - name: Deploy image
        run: |
          IMAGE="${{ env.ACR_SERVER }}/backlog-synthesizer:${{ github.sha }}"
          az containerapp update \
            --name "$STAGING_APP" \
            --resource-group "$RG" \
            --image "$IMAGE" \
            --set-env-vars \
              "CLIENT_NAME=Meridian Motors" \
              "JIRA_BASE_URL=https://vamshi58.atlassian.net" \
              "JIRA_EMAIL=vamshi58@gmail.com" \
              "JIRA_PROJECT_KEY=MM" \
              "ENTRA_TENANT_ID=5812d1e2-7392-48c9-9265-ba6c08c62346" \
              "ENTRA_TENANT_DOMAIN=vkrishna1404gmail.onmicrosoft.com" \
              "ENTRA_CLIENT_ID=786b0f93-b38d-41c7-8ebd-30a405b7385d" \
              "ANTHROPIC_API_KEY=secretref:anthropic-api-key" \
              "JIRA_API_TOKEN=secretref:jira-api-token" \
              "ENTRA_CLIENT_SECRET=secretref:entra-client-secret" \
            --registry-server "$ACR_SERVER" \
            --registry-username "$ACR" \
            --registry-password "secretref:acr-password" \
            --output none
          echo "✅ Deployed $IMAGE"

      - name: Health check
        run: |
          FQDN=$(az containerapp show \
            --name "$STAGING_APP" --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          URL="https://$FQDN/_stcore/health"
          echo "Probing $URL ..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
            echo "[$i/24] HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "✅ Healthy: https://$FQDN"; exit 0; }
            sleep 10
          done
          echo "❌ Health check failed after 4 minutes" >&2; exit 1

      - name: Summary
        run: |
          FQDN=$(az containerapp show \
            --name "$STAGING_APP" --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "## ✅ Staging deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.ACR_SERVER }}/backlog-synthesizer:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Next:** Add \`https://$FQDN/\` as a redirect URI in Azure app registration (Entra ID)" >> "$GITHUB_STEP_SUMMARY"

  # ── 3b. Deploy to Production ──────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [provision, build, deploy-staging]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') &&
      github.event.inputs.action == 'deploy-production'
    environment: azure-production

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure app secrets
        run: |
          ACR_PASS=$(az acr credential show --name "$ACR" --query passwords[0].value -o tsv)
          az containerapp secret set \
            --name "$PROD_APP" \
            --resource-group "$RG" \
            --secrets \
              "anthropic-api-key=${{ secrets.ANTHROPIC_API_KEY }}" \
              "jira-api-token=${{ secrets.JIRA_API_TOKEN }}" \
              "entra-client-secret=${{ secrets.ENTRA_CLIENT_SECRET }}" \
              "acr-password=$ACR_PASS" \
            --output none

      - name: Deploy image
        run: |
          IMAGE="${{ env.ACR_SERVER }}/backlog-synthesizer:${{ github.sha }}"
          SUFFIX="sha-${GITHUB_SHA::8}"
          az containerapp update \
            --name "$PROD_APP" \
            --resource-group "$RG" \
            --image "$IMAGE" \
            --revision-suffix "$SUFFIX" \
            --set-env-vars \
              "CLIENT_NAME=Meridian Motors" \
              "JIRA_BASE_URL=https://vamshi58.atlassian.net" \
              "JIRA_EMAIL=vamshi58@gmail.com" \
              "JIRA_PROJECT_KEY=MM" \
              "ENTRA_TENANT_ID=5812d1e2-7392-48c9-9265-ba6c08c62346" \
              "ENTRA_TENANT_DOMAIN=vkrishna1404gmail.onmicrosoft.com" \
              "ENTRA_CLIENT_ID=786b0f93-b38d-41c7-8ebd-30a405b7385d" \
              "ANTHROPIC_API_KEY=secretref:anthropic-api-key" \
              "JIRA_API_TOKEN=secretref:jira-api-token" \
              "ENTRA_CLIENT_SECRET=secretref:entra-client-secret" \
            --registry-server "$ACR_SERVER" \
            --registry-username "$ACR" \
            --registry-password "secretref:acr-password" \
            --output none

      - name: Health check
        run: |
          FQDN=$(az containerapp show \
            --name "$PROD_APP" --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          URL="https://$FQDN/_stcore/health"
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
            echo "[$i/24] HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "✅ Production healthy: https://$FQDN"; exit 0; }
            sleep 10
          done
          echo "❌ Health check failed" >&2; exit 1
