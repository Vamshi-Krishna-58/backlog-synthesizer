name: Infra + Deploy → Azure

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        default: deploy-staging
        options:
          - infra-only
          - deploy-staging
          - deploy-production
          - infra-and-deploy

env:
  RG:          rg-meridian-motors
  ACR:         meridianmotorsacr0452
  ACR_SERVER:  meridianmotorsacr0452.azurecr.io
  CAE:         cae-meridian-motors
  STAGING_APP: backlog-synthesizer-staging
  PROD_APP:    backlog-synthesizer-prod
  LOCATION:    eastus

jobs:
  # ── 1. Provision infra (az CLI, idempotent) ────────────────────────────────
  provision:
    name: Provision Azure infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register Azure resource providers
        run: |
          set -euo pipefail
          for ns in \
            Microsoft.ContainerRegistry \
            Microsoft.App \
            Microsoft.OperationalInsights \
            Microsoft.ContainerService; do
            STATE=$(az provider show --namespace "$ns" --query registrationState -o tsv 2>/dev/null || echo "Unknown")
            if [[ "$STATE" != "Registered" ]]; then
              echo "→ Registering $ns ..."
              az provider register --namespace "$ns" --wait
              echo "✅ $ns registered"
            else
              echo "✅ $ns already registered"
            fi
          done

      - name: Resource group
        run: |
          set -euo pipefail
          echo "→ Creating resource group $RG ..."
          az group create --name "$RG" --location "$LOCATION" --output none
          echo "✅ Resource group ready"

      - name: Azure Container Registry
        run: |
          set -euo pipefail
          echo "→ Checking ACR $ACR ..."
          if az acr show --name "$ACR" --resource-group "$RG" --query name -o tsv 2>/dev/null | grep -q "$ACR"; then
            echo "✅ ACR already exists"
          else
            echo "→ Creating ACR $ACR ..."
            az acr create \
              --name "$ACR" \
              --resource-group "$RG" \
              --sku Basic \
              --admin-enabled true \
              --output none
            echo "✅ ACR created: $ACR_SERVER"
          fi

      - name: Container Apps environment
        run: |
          set -euo pipefail
          echo "→ Checking Container Apps environment $CAE ..."
          if az containerapp env show --name "$CAE" --resource-group "$RG" --query name -o tsv 2>/dev/null | grep -q "$CAE"; then
            echo "✅ CAE already exists"
          else
            echo "→ Creating Container Apps environment ..."
            az containerapp env create \
              --name "$CAE" \
              --resource-group "$RG" \
              --location "$LOCATION" \
              --output none
            echo "✅ CAE created"
          fi

      - name: Staging Container App
        run: |
          set -euo pipefail
          echo "→ Checking staging app $STAGING_APP ..."
          if az containerapp show --name "$STAGING_APP" --resource-group "$RG" --query name -o tsv 2>/dev/null | grep -q "$STAGING_APP"; then
            echo "✅ Staging app already exists"
          else
            echo "→ Creating staging app ..."
            az containerapp create \
              --name "$STAGING_APP" \
              --resource-group "$RG" \
              --environment "$CAE" \
              --image "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
              --target-port 8502 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 1 \
              --output none
            echo "✅ Staging app created"
          fi

      - name: Production Container App
        run: |
          set -euo pipefail
          echo "→ Checking production app $PROD_APP ..."
          if az containerapp show --name "$PROD_APP" --resource-group "$RG" --query name -o tsv 2>/dev/null | grep -q "$PROD_APP"; then
            echo "✅ Production app already exists"
          else
            echo "→ Creating production app ..."
            az containerapp create \
              --name "$PROD_APP" \
              --resource-group "$RG" \
              --environment "$CAE" \
              --image "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
              --target-port 8502 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 3 \
              --output none
            echo "✅ Production app created"
          fi

      - name: Summary
        run: |
          STAGING_FQDN=$(az containerapp show --name "$STAGING_APP" --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "pending")
          echo "## ✅ Infrastructure ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Staging: https://$STAGING_FQDN" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Build & push Docker image to ACR ────────────────────────────────────
  build:
    name: Build & push → ACR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: provision
    if: needs.provision.result == 'success'

    steps:
      - name: Check if build should run
        id: gate
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [[ "$ACTION" == "infra-only" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Login to Azure
        if: steps.gate.outputs.skip != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify ACR exists
        if: steps.gate.outputs.skip != 'true'
        run: |
          if ! az acr show --name "$ACR" --query name -o tsv &>/dev/null; then
            echo "::error::ACR '$ACR' not found. Run action=infra-and-deploy first."
            exit 1
          fi
          echo "✅ ACR $ACR found"

      - name: Login to ACR
        if: steps.gate.outputs.skip != 'true'
        run: az acr login --name "$ACR"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.gate.outputs.skip != 'true'
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/backlog-synthesizer:${{ github.sha }}
            ${{ env.ACR_SERVER }}/backlog-synthesizer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3a. Deploy to Staging ──────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [provision, build]
    environment: azure-staging

    steps:
      - name: Check if deploy should run
        id: gate
        run: |
          ACTION="${{ github.event.inputs.action }}"
          EVENT="${{ github.event_name }}"
          if [[ "$EVENT" == "push" || "$ACTION" == "deploy-staging" || "$ACTION" == "infra-and-deploy" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping staging deploy (action=$ACTION)"
          fi

      - name: Login to Azure
        if: steps.gate.outputs.run == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure secrets and registry
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          ACR_PASS=$(az acr credential show --name "$ACR" --query passwords[0].value -o tsv)

          # Set all secrets in one call
          az containerapp secret set \
            --name "$STAGING_APP" --resource-group "$RG" \
            --secrets \
              "acr-password=$ACR_PASS" \
              "anthropic-api-key=${{ secrets.ANTHROPIC_API_KEY }}" \
              "jira-api-token=${{ secrets.JIRA_API_TOKEN }}" \
              "entra-client-secret=${{ secrets.ENTRA_CLIENT_SECRET }}" \
            --output none

          # Register ACR as a pull registry (separate command from update)
          az containerapp registry set \
            --name "$STAGING_APP" --resource-group "$RG" \
            --server "$ACR_SERVER" \
            --username "$ACR" \
            --password "$ACR_PASS" \
            --output none

      - name: Deploy image
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          IMAGE="${{ env.ACR_SERVER }}/backlog-synthesizer:${{ github.sha }}"
          az containerapp update \
            --name "$STAGING_APP" --resource-group "$RG" \
            --image "$IMAGE" \
            --set-env-vars \
              "CLIENT_NAME=Meridian Motors" \
              "JIRA_BASE_URL=https://vamshi58.atlassian.net" \
              "JIRA_EMAIL=vamshi58@gmail.com" \
              "JIRA_PROJECT_KEY=MM" \
              "ENTRA_TENANT_ID=5812d1e2-7392-48c9-9265-ba6c08c62346" \
              "ENTRA_TENANT_DOMAIN=vkrishna1404gmail.onmicrosoft.com" \
              "ENTRA_CLIENT_ID=786b0f93-b38d-41c7-8ebd-30a405b7385d" \
              "ANTHROPIC_API_KEY=secretref:anthropic-api-key" \
              "JIRA_API_TOKEN=secretref:jira-api-token" \
              "ENTRA_CLIENT_SECRET=secretref:entra-client-secret" \
            --output none
          echo "✅ Deployed $IMAGE"

      - name: Health check
        if: steps.gate.outputs.run == 'true'
        run: |
          FQDN=$(az containerapp show \
            --name "$STAGING_APP" --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          URL="https://$FQDN/_stcore/health"
          echo "Probing $URL ..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
            echo "[$i/24] HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "✅ Healthy: https://$FQDN"; exit 0; }
            sleep 10
          done
          echo "❌ Health check timed out" >&2; exit 1

      - name: Summary
        if: steps.gate.outputs.run == 'true'
        run: |
          FQDN=$(az containerapp show \
            --name "$STAGING_APP" --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "## ✅ Staging deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
          echo "**Next:** add \`https://$FQDN/\` as redirect URI in Entra app registration" >> "$GITHUB_STEP_SUMMARY"

  # ── 3b. Deploy to Production ───────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [provision, build, deploy-staging]
    environment: azure-production

    steps:
      - name: Check if deploy should run
        id: gate
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [[ "$ACTION" == "deploy-production" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping production deploy (action=$ACTION)"
          fi

      - name: Login to Azure
        if: steps.gate.outputs.run == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure secrets and registry
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          ACR_PASS=$(az acr credential show --name "$ACR" --query passwords[0].value -o tsv)
          az containerapp secret set \
            --name "$PROD_APP" --resource-group "$RG" \
            --secrets \
              "acr-password=$ACR_PASS" \
              "anthropic-api-key=${{ secrets.ANTHROPIC_API_KEY }}" \
              "jira-api-token=${{ secrets.JIRA_API_TOKEN }}" \
              "entra-client-secret=${{ secrets.ENTRA_CLIENT_SECRET }}" \
            --output none
          az containerapp registry set \
            --name "$PROD_APP" --resource-group "$RG" \
            --server "$ACR_SERVER" \
            --username "$ACR" \
            --password "$ACR_PASS" \
            --output none

      - name: Deploy image
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          IMAGE="${{ env.ACR_SERVER }}/backlog-synthesizer:${{ github.sha }}"
          az containerapp update \
            --name "$PROD_APP" --resource-group "$RG" \
            --image "$IMAGE" \
            --revision-suffix "sha-${GITHUB_SHA::8}" \
            --set-env-vars \
              "CLIENT_NAME=Meridian Motors" \
              "JIRA_BASE_URL=https://vamshi58.atlassian.net" \
              "JIRA_EMAIL=vamshi58@gmail.com" \
              "JIRA_PROJECT_KEY=MM" \
              "ENTRA_TENANT_ID=5812d1e2-7392-48c9-9265-ba6c08c62346" \
              "ENTRA_TENANT_DOMAIN=vkrishna1404gmail.onmicrosoft.com" \
              "ENTRA_CLIENT_ID=786b0f93-b38d-41c7-8ebd-30a405b7385d" \
              "ANTHROPIC_API_KEY=secretref:anthropic-api-key" \
              "JIRA_API_TOKEN=secretref:jira-api-token" \
              "ENTRA_CLIENT_SECRET=secretref:entra-client-secret" \
            --output none
          echo "✅ Deployed $IMAGE"
