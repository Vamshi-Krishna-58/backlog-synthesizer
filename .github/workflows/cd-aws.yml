name: Deploy → AWS

# Trigger:
#   • Push to main        → deploys to staging automatically
#   • workflow_dispatch   → choose target environment from the dropdown
#
# Pipeline:
#   staging only       → build → deploy ECS staging → smoke test
#   production         → build → deploy ECS production (rolling + circuit breaker) → soak
#   staging→production → build → ECS staging → smoke test → ECS production → soak
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID       IAM access key for the GitHub Actions deploy user
#   AWS_SECRET_ACCESS_KEY   IAM secret key for the GitHub Actions deploy user
#   AWS_REGION              e.g. us-east-1
#   AWS_ECR_REGISTRY        e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com
#   AWS_ECS_CLUSTER         e.g. backlog-synthesizer
#   AWS_ALB_NAME            e.g. backlog-synthesizer
#
# Required GitHub Environments (Settings → Environments):
#   aws-staging    — no protection rules
#   aws-production — add "Required reviewers" for manual approval gate

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
          - staging → production
      skip_smoke_test:
        description: "Skip smoke test (emergency production deploy only)"
        type: boolean
        default: false

env:
  ECR_IMAGE: ${{ secrets.AWS_ECR_REGISTRY }}/backlog-synthesizer

jobs:
  # ── 1. Build & push to Elastic Container Registry ────────────────────────
  push-ecr:
    name: Build & push → ECR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.img.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_IMAGE }}:${{ github.sha }}
            ${{ env.ECR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image reference
        id: img
        run: echo "image=${{ env.ECR_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ── 2. Deploy to ECS staging ──────────────────────────────────────────────
  # Runs on: push to main (always), or manual with staging / staging→production selected
  deploy-staging:
    name: Deploy → ECS staging
    runs-on: ubuntu-latest
    needs: push-ecr
    if: |
      github.event_name == 'push' ||
      inputs.environment == 'staging' ||
      inputs.environment == 'staging → production'
    environment: aws-staging
    timeout-minutes: 15
    outputs:
      health_url: ${{ steps.health.outputs.url }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download current staging task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition backlog-synthesizer-staging \
            --query taskDefinition \
            > /tmp/task-def-staging.json

      - name: Inject new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-def-staging.json
          container-name: backlog-synthesizer
          image: ${{ needs.push-ecr.outputs.image }}

      - name: Deploy to ECS staging service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: backlog-synthesizer-staging
          cluster: ${{ secrets.AWS_ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Resolve staging health URL
        id: health
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ secrets.AWS_ALB_NAME }}" \
            --query "LoadBalancers[0].DNSName" \
            --output text)
          echo "url=http://$ALB_DNS:8080/_stcore/health" >> "$GITHUB_OUTPUT"
          echo "Staging health: http://$ALB_DNS:8080/_stcore/health"

  # ── 3. Smoke test staging ─────────────────────────────────────────────────
  smoke-test:
    name: Smoke test — ECS staging health
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: ${{ needs.deploy-staging.result == 'success' && inputs.skip_smoke_test != true }}
    timeout-minutes: 5

    steps:
      - name: Wait for healthy response (2-min window, 10-s intervals)
        run: |
          URL="${{ needs.deploy-staging.outputs.health_url }}"
          echo "Probing: $URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
            echo "Attempt $i/12: HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "ECS staging healthy."; exit 0; }
            sleep 10
          done
          echo "ERROR: health endpoint did not return 200 within 2 minutes." >&2
          exit 1

  # ── 4. Deploy to ECS production ───────────────────────────────────────────
  # Runs on: manual trigger with production or staging→production selected
  deploy-prod:
    name: Deploy → ECS production
    runs-on: ubuntu-latest
    needs: [push-ecr, deploy-staging, smoke-test]
    if: |
      always() &&
      needs.push-ecr.result == 'success' &&
      (inputs.environment == 'production' || inputs.environment == 'staging → production') &&
      (
        needs.smoke-test.result == 'success' ||
        needs.smoke-test.result == 'skipped' ||
        inputs.skip_smoke_test == true
      )
    environment: aws-production
    timeout-minutes: 20

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download current production task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition backlog-synthesizer \
            --query taskDefinition \
            > /tmp/task-def-prod.json

      - name: Inject new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-def-prod.json
          container-name: backlog-synthesizer
          image: ${{ needs.push-ecr.outputs.image }}

      - name: Enable ECS deployment circuit-breaker (auto-rollback)
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.AWS_ECS_CLUSTER }}" \
            --service backlog-synthesizer \
            --deployment-configuration \
              "deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=150,minimumHealthyPercent=100" \
            --output none
          echo "Deployment circuit-breaker enabled (auto-rollback on health-check failure)"

      - name: Deploy to ECS production (rolling — 1 task at a time)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: backlog-synthesizer
          cluster: ${{ secrets.AWS_ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Verify production health
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ secrets.AWS_ALB_NAME }}" \
            --query "LoadBalancers[0].DNSName" \
            --output text)
          URL="http://$ALB_DNS/_stcore/health"
          echo "Probing: $URL"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
            echo "Attempt $i/18: HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "ECS production healthy. Live at: http://$ALB_DNS"; exit 0; }
            sleep 10
          done
          echo "ERROR: production health check failed." >&2
          exit 1

      - name: Canary soak — monitor error rate (3 min)
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ secrets.AWS_ALB_NAME }}" \
            --query "LoadBalancers[0].DNSName" \
            --output text)
          URL="http://$ALB_DNS/_stcore/health"
          echo "Canary soak: probing every 15 s for 3 minutes…"
          FAILURES=0
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
            echo "Probe $i/12: HTTP $STATUS"
            [ "$STATUS" != "200" ] && FAILURES=$((FAILURES + 1))
            [ $i -lt 12 ] && sleep 15
          done
          if [ "$FAILURES" -gt 2 ]; then
            echo "ERROR: $FAILURES/12 health probes failed — ECS circuit-breaker will auto-rollback." >&2
            exit 1
          fi
          echo "Canary soak passed ($FAILURES/12 failures — within tolerance)."

      - name: Rollback notice
        if: failure()
        run: |
          echo "::warning::Production deploy failed. ECS deployment circuit-breaker is" \
               "configured to auto-rollback to the previous task definition." \
               "Check ECS service events in the AWS console."

  # ── 5. Summary ────────────────────────────────────────────────────────────
  summary:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: [push-ecr, deploy-staging, smoke-test, deploy-prod]
    if: always()
    steps:
      - name: Write job summary
        run: |
          echo "## AWS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** \`${{ inputs.environment || 'staging (auto — push to main)' }}\`  " >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ needs.push-ecr.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & push ECR  | ${{ needs.push-ecr.result }} |"       >> $GITHUB_STEP_SUMMARY
          echo "| Deploy staging    | ${{ needs.deploy-staging.result }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| Smoke test        | ${{ needs.smoke-test.result }} |"       >> $GITHUB_STEP_SUMMARY
          echo "| Deploy production | ${{ needs.deploy-prod.result }} |"     >> $GITHUB_STEP_SUMMARY
